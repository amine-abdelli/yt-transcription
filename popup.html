<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Transcript Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="container">
    <h1 data-i18n="title">YouTube Transcript Downloader</h1>

    <div class="status" id="status" data-i18n="readyStatus">
      Ready to download transcript
    </div>

    <div class="option">
      <label>
        <input type="checkbox" id="includeTimestamps" checked>
        <span data-i18n="includeTimestamps">Include timestamps</span>
      </label>
    </div>

    <button id="downloadBtn" class="download-btn" data-i18n="downloadBtn">
      Download Transcript
    </button>

    <div class="divider"></div>

    <div class="settings-section">
      <h2 data-i18n="aiSummarySettings">AI Summary Settings</h2>

      <div class="api-key-section">
        <label for="apiKeyInput" data-i18n="openaiApiKey">OpenAI API Key:</label>
        <div id="apiKeyStatus" class="api-key-status" style="display: none;">
          <span class="status-indicator">✓</span>
          <span data-i18n="apiKeyConfigured">API Key configured</span>
          <button id="modifyApiKey" class="modify-btn" data-i18n="modifyBtn">Modify</button>
        </div>
        <div id="apiKeyInputGroup" class="input-group">
          <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
          <button id="toggleApiKey" class="icon-btn" title="Show/Hide API Key">
            👁️
          </button>
        </div>
        <button id="saveApiKey" class="save-btn" data-i18n="saveApiKey">Save API Key</button>
        <p class="api-key-info">
          <small data-i18n="apiKeyInfo">Get your API key from OpenAI. Your key is stored locally and never shared.</small>
        </p>
      </div>

      <div class="language-section">
        <label for="languageSelect" data-i18n="summaryLanguage">Summary Language:</label>
        <select id="languageSelect" class="language-select">
          <option value="fr">Français</option>
          <option value="en">English</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
        </select>
      </div>
    </div>

    <div class="info">
      <p data-i18n="makeInfo">Make sure you're on a YouTube video page with captions available.</p>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="openai-summary.js"></script>
  <script src="popup.js"></script>
</body>

</html>
